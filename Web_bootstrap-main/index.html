<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Portal | Web Programming Assignment</title>
    
    <!-- External Stylesheets -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #0f172a;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            flex-grow: 1;
        }
        .media-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .media-card:hover {
            transform: translateY(-5px);
        }
        .media-img-wrapper {
            height: 200px;
            background: rgba(15, 23, 42, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .media-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Navigation Menu Container -->
    <div id="menu-container"></div>

    <!-- Main Content Wrapper -->
    <main class="main-container mt-4">
        
        <!-- Header Section -->
        <div id="home" class="p-5 mb-4 bg-secondary bg-opacity-10 border border-secondary border-opacity-25 rounded-4 text-center">
            <h1 class="display-5 fw-bold text-light">Kittinun Sukha</h1>
            <p class="fs-5 text-secondary">ระบบจัดการคลังไอเทม (Inventory Portal)</p>
        </div>

        <!-- Carousel Section -->
        <div id="heroCarousel" class="carousel slide mb-5 rounded-4 overflow-hidden border border-secondary border-opacity-25" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="Img1/bar.jpg" class="d-block w-100" alt="Barrett" style="height: 350px; object-fit: cover; filter: brightness(0.85);">
                </div>
                <div class="carousel-item">
                    <img src="Img1/kriss.png" class="d-block w-100" alt="Kriss SV" style="height: 350px; object-fit: cover; filter: brightness(0.85);">
                </div>
                <div class="carousel-item">
                    <img src="Img1/blue.png" class="d-block w-100" alt="Character" style="height: 350px; object-fit: cover; filter: brightness(0.85);">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>

        <!-- Products Section -->
        <div id="products" class="mb-4">
            <h2 class="h4 fw-bold text-light mb-3"><i class="bi bi-grid-fill me-2 text-primary"></i> รายการไอเทมทั้งหมด</h2>
        </div>

        <div class="row g-4">
            
            <!-- Item 1 -->
            <div class="col-12 col-md-4">
                <div class="media-card h-100 d-flex flex-column">
                    <div class="media-img-wrapper">
                        <img src="Img1/bar.jpg" alt="บาเรตถาวร">
                    </div>
                    <div class="p-3 flex-grow-1">
                        <h3 class="h5 fw-bold text-light">บาเรตถาวร</h3>
                        <p class="text-warning fw-bold fs-5 mb-0">฿890</p>
                    </div>
                    <div class="p-3 pt-0">
                        <button class="btn btn-primary w-100" onclick="handleBuyItem('บาเรตถาวร', 890)">ซื้อสินค้า</button>
                    </div>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="col-12 col-md-4">
                <div class="media-card h-100 d-flex flex-column">
                    <div class="media-img-wrapper">
                        <img src="Img1/kriss.png" alt="kriss sv">
                    </div>
                    <div class="p-3 flex-grow-1">
                        <h3 class="h5 fw-bold text-light">kriss sv</h3>
                        <p class="text-warning fw-bold fs-5 mb-0">฿650</p>
                    </div>
                    <div class="p-3 pt-0">
                        <button class="btn btn-primary w-100" onclick="handleBuyItem('kriss sv', 650)">ซื้อสินค้า</button>
                    </div>
                </div>
            </div>

            <!-- Item 3 -->
            <div class="col-12 col-md-4">
                <div class="media-card h-100 d-flex flex-column">
                    <div class="media-img-wrapper">
                        <img src="Img1/ball.png" alt="บอลน้ำ">
                    </div>
                    <div class="p-3 flex-grow-1">
                        <h3 class="h5 fw-bold text-light">บอลน้ำ</h3>
                        <p class="text-warning fw-bold fs-5 mb-0">฿150</p>
                    </div>
                    <div class="p-3 pt-0">
                        <button class="btn btn-primary w-100" onclick="handleBuyItem('บอลน้ำ', 150)">ซื้อสินค้า</button>
                    </div>
                </div>
            </div>

            <!-- Item 4 -->
            <div class="col-12 col-md-4">
                <div class="media-card h-100 d-flex flex-column">
                    <div class="media-img-wrapper">
                        <img src="Img1/dual.png" alt="พกคู่">
                    </div>
                    <div class="p-3 flex-grow-1">
                        <h3 class="h5 fw-bold text-light">พกคู่</h3>
                        <p class="text-warning fw-bold fs-5 mb-0">฿390</p>
                    </div>
                    <div class="p-3 pt-0">
                        <button class="btn btn-primary w-100" onclick="handleBuyItem('พกคู่', 390)">ซื้อสินค้า</button>
                    </div>
                </div>
            </div>

            <!-- Item 5 -->
            <div class="col-12 col-md-4">
                <div class="media-card h-100 d-flex flex-column">
                    <div class="media-img-wrapper">
                        <img src="Img1/blue.png" alt="ฟ้า">
                    </div>
                    <div class="p-3 flex-grow-1">
                        <h3 class="h5 fw-bold text-light">ฟ้า</h3>
                        <p class="text-warning fw-bold fs-5 mb-0">฿550</p>
                    </div>
                    <div class="p-3 pt-0">
                        <button class="btn btn-primary w-100" onclick="handleBuyItem('ฟ้า', 550)">ซื้อสินค้า</button>
                    </div>
                </div>
            </div>

            <!-- Item 6 -->
            <div class="col-12 col-md-4">
                <div class="media-card h-100 d-flex flex-column">
                    <div class="media-img-wrapper">
                        <img src="Img1/red.png" alt="แดง">
                    </div>
                    <div class="p-3 flex-grow-1">
                        <h3 class="h5 fw-bold text-light">แดง</h3>
                        <p class="text-warning fw-bold fs-5 mb-0">฿550</p>
                    </div>
                    <div class="p-3 pt-0">
                        <button class="btn btn-primary w-100" onclick="handleBuyItem('แดง', 550)">ซื้อสินค้า</button>
                    </div>
                </div>
            </div>

        </div>


    </main>

    <!-- Footer Dynamic Container Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script>
        function handleBuyItem(itemName, price) {
            alert('🛒 สั่งซื้อสำเร็จ: ' + itemName + ' ราคา ' + price + ' บาท');
        }

        // Automatically load menu.html and footer.html
        document.addEventListener("DOMContentLoaded", () => {
            fetch("menu.html")
                .then(res => res.text())
                .then(data => { document.getElementById("menu-container").innerHTML = data; });

            fetch("footer.html")
                .then(res => res.text())
                .then(data => { document.getElementById("footer-placeholder").innerHTML = data; });
        });
    </script>
</body>
</html>
