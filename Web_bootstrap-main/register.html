<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียน - Register</title>
    <!-- Bootstrap 5 CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --surface-card: #1e293b;
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --radius-lg: 24px;
            --radius-md: 14px;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
        }

        .bg-glow {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: var(--accent-glow);
            filter: blur(120px);
            z-index: -1;
            pointer-events: none;
        }
        .glow-1 { top: -50px; left: -50px; }
        .glow-2 { bottom: -50px; right: -50px; background: rgba(236, 72, 153, 0.2); }

        .main-container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 2.5rem 1rem;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 550px; /* Limits maximum width so it stays clean and form-focused */
        }

        .form-floating > .form-control,
        .form-floating > .form-select {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-md);
        }

        .form-floating > .form-control:focus,
        .form-floating > .form-select:focus {
            background-color: rgba(15, 23, 42, 0.9);
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px var(--accent-glow);
            color: var(--text-primary);
        }

        .form-floating > label { color: var(--text-muted); }
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label,
        .form-floating > .form-select ~ label { color: var(--accent-primary); }

        .btn-gradient-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            padding: 0.85rem 1.5rem;
            font-weight: 600;
            box-shadow: 0 4px 14px var(--accent-glow);
            transition: all 0.2s ease;
        }
        .btn-gradient-primary:hover { opacity: 0.95; box-shadow: 0 6px 20px var(--accent-glow); color: #ffffff; }

        .btn-glass-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.85rem 1.5rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-glass-secondary:hover { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); }
    </style>
</head>
<body>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div id="menu-container"></div>

    <div class="main-container">
        <div class="glass-card">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 64px; height: 64px; background: linear-gradient(135deg, #6366f1, #ec4899);">
                    <i class="bi bi-person-plus-fill text-light fs-2"></i>
                </div>
                <h2 class="h3 fw-bold mb-1">สร้างบัญชีผู้ใช้ใหม่</h2>
                <p class="text-secondary small mb-0">กรอกข้อมูลเพื่อลงทะเบียนสมาชิกและเริ่มใช้งาน</p>
            </div>

            <form id="registerForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-content form-control" id="firstname" placeholder="Firstname" required>
                            <label for="firstname">ชื่อ</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-content form-control" id="lastname" placeholder="Lastname" required>
                            <label for="lastname">นามสกุล</label>
                        </div>
                    </div>
                </div>

                <div class="form-floating mt-3 mb-3">
                    <input type="tel" class="form-control" id="phone" placeholder="Telephone" required>
                    <label for="phone">เบอร์โทรศัพท์</label>
                </div>

                <div class="form-floating mb-3">
                    <select class="form-select" id="province" required>
                        <option value="" selected disabled>เลือกจังหวัด...</option>
                        <option value="1">สระแก้ว</option>
                        <option value="2">ชลบุรี</option>
                        <option value="3">ระยอง</option>
                    </select>
                    <label for="province">จังหวัด</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <label for="email">อีเมล (Email)</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                    <label for="password">รหัสผ่าน (Password)</label>
                </div>

                <div class="d-flex flex-column gap-3">
                    <button type="submit" class="btn btn-gradient-primary w-100">ลงทะเบียนบัญชี</button>
                    <a href="index.html" class="btn btn-glass-secondary w-100 text-center text-decoration-none">กลับสู่หน้าหลัก</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch("menu.html")
                .then(response => response.ok ? response.text() : "")
                .then(data => document.getElementById("menu-container").innerHTML = data);

            document.getElementById('registerForm').addEventListener('submit', (e) => {
                e.preventDefault();
                alert("ลงทะเบียนสำเร็จ!");
                window.location.href = "index.html";
            });
        });
    </script>
</body>
</html>
